services:
  monitor:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
        APP_UID: ${PUID:-99}
        APP_GID: ${PGID:-100}
    platform: linux/amd64
    image: sommerauer-monitor:${APP_VERSION:-0.1.0}
    user: "${PUID:-99}:${PGID:-100}"
    init: true
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      MODBUS_HOST: ${MODBUS_HOST:-}
      MODBUS_PORT: ${MODBUS_PORT:-502}
      MODBUS_UNIT_ID: ${MODBUS_UNIT_ID:-255}
      REGISTER_PROFILE: ${REGISTER_PROFILE:-core}
      COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-false}
      DATA_DIR: /data
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Europe/Vienna}
    volumes:
      - "${DATA_PATH:-./data}:/data"
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,sys,urllib.request; response=urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=2); sys.exit(0 if json.load(response).get('status') == 'ok' else 1)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
