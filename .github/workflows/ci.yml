name: Offline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.2"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run build

  write-test-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.write-test -t sommerauer-write-test:ci .
      - name: Schreibtest-Container ohne Netzwerk synthetisch prüfen
        run: >-
          docker run --rm --network none
          --mount type=bind,src="${{ github.workspace }}/examples",dst=/examples,readonly
          --tmpfs /data:rw,noexec,nosuid,size=1m,mode=1777
          sommerauer-write-test:ci simulate
          --plan /examples/write_plan.synthetic.json --journal /data/synthetic.sqlite
